name: controller-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ARM C compiler and headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-dev
      - name: Compile Cortex-M4F C library and STM32 adapter
        run: python3 tools/check_arm_build.py --newlib-include /usr/include/newlib --report build/ci-arm-compile.json
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Build and test C
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
      - name: Address and undefined behavior checks
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DYAW_SANITIZERS=ON
          cmake --build build-sanitize -j 2
          ctest --test-dir build-sanitize --output-on-failure
      - name: Python numerical tests
        run: |
          python -m pip install -r requirements.txt
          python tools/fetch_upstream.py
          python tools/generate_profile_headers.py --check
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Recompute synthetic benchmarks
        run: |
          python sim/run_benchmarks.py --output build/ci-results
          python sim/compare_upstream.py --output build/ci-upstream
          python sim/run_sensitivity.py --output build/ci-sensitivity
          python sim/analyze_local_dynamics.py --output build/ci-local-dynamics.json
          python sim/run_motor_profiles.py --output build/ci-motor-profiles
          python tools/check_performance.py --report build/ci-motor-profiles/metrics.json --output build/ci-performance.json
          python tools/check_integration_convergence.py --output build/ci-convergence.json
      - name: Recompute complete pitch experiment and check declared holdout groups
        run: |
          python sim/run_pitch_profiles.py --phase full --output build/ci-pitch
          python - <<'PY'
          import json
          import math
          from dataclasses import asdict
          from pathlib import Path
          from sim.run_pitch_profiles import (load_profiles, assess_group, cases, PitchCase,
              Config, config_dict, LABELS, DEVELOPMENT_SEEDS, HOLDOUT_SEEDS)

          report = json.loads(Path("build/ci-pitch/metrics.json").read_text())
          assert report["phase"] == "full" and report["source_unchanged_during_run"] is True
          profiles = load_profiles()
          assert set(report["profiles"]) == {profile["name"] for profile in profiles}
          complete_gate = []
          for profile in profiles:
              entry = report["profiles"][profile["name"]]
              assert entry["integration_convergence"]["passed"] is True
              assert [row["case"] for row in entry["cases"]] == [asdict(case) for case in cases()]
              assert [row["seed"] for row in entry["development"]] == list(DEVELOPMENT_SEEDS)
              for row in entry["development"]:
                  assert row["case"] == asdict(PitchCase())
                  for label in LABELS:
                      metric = row["variants"][label]
                      assert metric["completed"] and not metric["first_latched_fault"]
                      assert not metric["first_physical_limit_crossing"]
                      assert metric["actual_c_config"] == config_dict(Config(**profile["controller"]))
                      for key in ("position_rmse_deg", "position_max_abs_error_deg", "command_rms_nm"):
                          value = metric[key]
                          assert type(value) in (int, float) and math.isfinite(value) and value >= 0
              development = assess_group(profile, entry["development"], DEVELOPMENT_SEEDS)
              holdout = assess_group(profile, entry["holdout"], HOLDOUT_SEEDS)
              assert development == entry["development_acceptance"]
              assert holdout == entry["holdout_acceptance"]
              complete_gate.extend((development["passed"], holdout["passed"]))
              print(profile["name"], "development:", development, "holdout:", holdout)
              assert holdout["passed"], "Preselected pitch holdout performance gate failed"
          assert report["all_primary_acceptance_passed"] == all(complete_gate)
          print("Full development + holdout performance acceptance:", report["all_primary_acceptance_passed"])
          print("Pitch CI asserts holdout performance only; retained GM development failure is not a pass.")
          PY
